---
- name: Provision EC2 services host
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Read Cloudflare API token
      ansible.builtin.set_fact:
        cloudflare_api_token: "{{ lookup('ansible.builtin.file', cloudflare_api_token_file) | trim }}"

    - name: Find latest RHEL AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "{{ services_host.ami_owner }}"
        filters:
          name: "{{ services_host.ami_filter }}"
          architecture: x86_64
          state: available
      register: rhel_amis

    - name: Set latest AMI
      ansible.builtin.set_fact:
        latest_ami: "{{ rhel_amis.images | sort(attribute='creation_date') | last }}"

    - name: Display selected AMI
      ansible.builtin.debug:
        msg: "Using AMI {{ latest_ami.image_id }} ({{ latest_ami.name }})"

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ services_host.vpc.name }}"
        cidr_block: "{{ services_host.vpc.cidr }}"
        region: "{{ aws_region }}"
        tags:
          ManagedBy: exarep-iac
        state: present
      register: vpc

    - name: Create subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ services_host.vpc.subnet_cidr }}"
        region: "{{ aws_region }}"
        map_public: true
        tags:
          Name: "{{ services_host.vpc.name }}-public"
          ManagedBy: exarep-iac
        state: present
      register: subnet

    - name: Create internet gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ services_host.vpc.name }}-igw"
          ManagedBy: exarep-iac
        state: present
      register: igw

    - name: Create route table with internet access
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ services_host.vpc.name }}-public-rt"
          ManagedBy: exarep-iac
        state: present

    - name: Create security group
      amazon.aws.ec2_security_group:
        name: "{{ services_host.security_group }}"
        description: "Security group for exarep services host"
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: 22
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH
          - proto: tcp
            ports: 443
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTPS
          - proto: tcp
            ports: 80
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTP (certbot)
        tags:
          ManagedBy: exarep-iac
        state: present
      register: security_group

    - name: Import SSH key pair
      amazon.aws.ec2_key:
        name: "{{ services_host.key_name }}"
        key_material: "{{ lookup('ansible.builtin.file', ssh_key_file) }}"
        region: "{{ aws_region }}"
        tags:
          ManagedBy: exarep-iac
        state: present

    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ services_host.tags.Name }}"
        instance_type: "{{ services_host.instance_type }}"
        image_id: "{{ latest_ami.image_id }}"
        key_name: "{{ services_host.key_name }}"
        security_groups:
          - "{{ security_group.group_id }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        network_interfaces:
          - assign_public_ip: true
            device_index: 0
            subnet_id: "{{ subnet.subnet.id }}"
            groups:
              - "{{ security_group.group_id }}"
        region: "{{ aws_region }}"
        tags: "{{ services_host.tags }}"
        state: running
        wait: true
      register: ec2_instance

    - name: Allocate Elastic IP
      amazon.aws.ec2_eip:
        device_id: "{{ ec2_instance.instances[0].instance_id }}"
        region: "{{ aws_region }}"
        tags:
          Name: exarep-services-host
          ManagedBy: exarep-iac
        state: present
      register: elastic_ip

    - name: Wait for instance to boot
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting for EC2 instance to boot..."

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ elastic_ip.public_ip }}"
        port: 22
        timeout: 300

    - name: Verify SSH connectivity
      ansible.builtin.command:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/exarep ec2-user@{{ elastic_ip.public_ip }} echo ok
      register: ssh_check
      retries: 5
      delay: 15
      until: ssh_check.rc == 0
      changed_when: false

    - name: Create A record for {{ keycloak.hostname }} in Cloudflare
      community.general.cloudflare_dns:
        zone: "{{ base_domain }}"
        record: "{{ keycloak.hostname }}"
        type: A
        value: "{{ elastic_ip.public_ip }}"
        state: present
        solo: true
        api_token: "{{ cloudflare_api_token }}"

    - name: Add instance to in-memory services group
      ansible.builtin.add_host:
        name: "{{ elastic_ip.public_ip }}"
        groups: services
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/exarep"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: Display provisioning summary
      ansible.builtin.debug:
        msg:
          - "Services host provisioned."
          - "  Instance ID : {{ ec2_instance.instances[0].instance_id }}"
          - "  Elastic IP  : {{ elastic_ip.public_ip }}"
          - "  AMI         : {{ latest_ami.image_id }} ({{ latest_ami.name }})"
          - "  DNS         : {{ keycloak.hostname }} → {{ elastic_ip.public_ip }}"
